# Phase 1 CI workflow.
#
# Job topology:
#   banlist        — full-repo ban-pattern grep
#   lint           — PHPCS + PHPStan (single PHP 8.2 cell)
#   test           — 3-cell PHPUnit unit matrix: PHP {7.4, 8.3, 8.4} × WP {6.9}
#                    Floor (PHP 7.4) + WP-recommended (8.3) + ceiling (8.4).
#                    Unit suite only — pure-PHP via Yoast polyfills, no WP boot, no DB.
#   dist           — build the release zip via bin/build-release.sh
#   plugin-check   — WordPress/plugin-check-action@v1 against the dist zip
#
# Note on scope:
# Code targets PHP 7.4–8.4 and WP 6.6 → 7.0 (forward-compat). The CI matrix is
# deliberately narrow to keep wall time down; PHP 8.2 + WP {6.6, 6.7, 6.8} cells
# are added back when integration tests land in a later phase.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  banlist:
    name: Ban-list grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run banlist (full-repo scan)
        run: bash bin/check-banlist.sh

  lint:
    name: PHPCS + PHPStan (single PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=Off

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: composer phpcs
      - run: composer phpstan

  test:
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: composer test:unit

  dist:
    name: Build dist zip
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --classmap-authoritative --no-interaction --no-progress

      - run: bash bin/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: better-rest-api-logs-dist
          path: release/better-rest-api-logs.zip
          retention-days: 7

  plugin-check:
    name: WP plugin-check (against dist zip)
    runs-on: ubuntu-latest
    needs: [dist]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: better-rest-api-logs-dist
          path: dist/

      - name: Unzip dist
        run: |
          mkdir -p plugin-check-target
          unzip -q dist/better-rest-api-logs.zip -d plugin-check-target/

      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: plugin-check-target/better-rest-api-logs
          wp-version: 'latest'
          categories: 'plugin_repo,security'
