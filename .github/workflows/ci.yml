# CI workflow.
#
# Job topology:
#   banlist        — full-repo ban-pattern grep
#   lint           — PHPCS + PHPStan + check-table-naming + check-settings-isolation
#                    (single PHP 8.3 cell)
#   test           — single-cell PHPUnit: PHP 8.3 × latest WP (the WP-recommended
#                    runtime). Runs unit AND integration suites against a
#                    MariaDB 10.11 service container. Coverage gate runs here.
#   dist           — build the release zip via bin/build-release.sh
#   plugin-check   — WordPress/plugin-check-action@v1 against the dist zip
#
# Note on scope:
# Code targets PHP 7.4–8.4 and WP 6.6 → 7.0 (forward-compat). CI samples the
# WP-recommended cell only (PHP 8.3 + current WP); broader PHP coverage is
# verified locally via DDEV overlays before any release tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  banlist:
    name: Ban-list grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run banlist (full-repo scan)
        run: bash bin/check-banlist.sh

  lint:
    name: PHPCS + PHPStan (single PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=Off

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: composer phpcs
      - run: composer phpstan
      - run: composer check:table-naming
      - run: composer check:settings-isolation
      - run: composer check:asset-enqueue

  test:
    name: PHPUnit (PHP 8.3 × latest WP)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, mysql, pcov
          coverage: pcov
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install WordPress core for integration tests
        # wp-phpunit/wp-phpunit ships only the test framework, not WP core.
        # Download the latest WP tarball into /tmp/wp-core and point ABSPATH
        # at it from the generated wp-tests-config.php.
        run: |
          mkdir -p /tmp/wp-core
          curl -fsSL https://wordpress.org/latest.tar.gz -o /tmp/wp.tar.gz
          tar -xf /tmp/wp.tar.gz -C /tmp/wp-core --strip-components=1
          ls /tmp/wp-core/wp-settings.php

      - name: Configure wp-phpunit DB env
        run: |
          {
            echo "WP_TESTS_DB_HOST=127.0.0.1:3306"
            echo "WP_TESTS_DB_USER=root"
            echo "WP_TESTS_DB_PASSWORD=root"
            echo "WP_TESTS_DB_NAME=wordpress_test"
            echo "WP_PHPUNIT__TESTS_CONFIG=${{ github.workspace }}/wp-tests-config.php"
          } >> "$GITHUB_ENV"

      - name: Generate wp-tests-config.php for CI runner
        # wp-tests-config.php is gitignored (carries DDEV-local paths and
        # placeholder salts not suitable for prod). Regenerate a CI-only copy
        # so the integration suite can bootstrap wp-phpunit. ABSPATH points
        # at the WP core downloaded in the previous step.
        run: |
          cat > wp-tests-config.php <<'PHP'
          <?php
          // CI-generated config — do not commit. Regenerated by .github/workflows/ci.yml.
          define( 'ABSPATH', '/tmp/wp-core/' );
          define( 'DB_NAME',     getenv( 'WP_TESTS_DB_NAME' )     ?: 'wordpress_test' );
          define( 'DB_USER',     getenv( 'WP_TESTS_DB_USER' )     ?: 'root' );
          define( 'DB_PASSWORD', getenv( 'WP_TESTS_DB_PASSWORD' ) ?: 'root' );
          define( 'DB_HOST',     getenv( 'WP_TESTS_DB_HOST' )     ?: '127.0.0.1:3306' );
          define( 'DB_CHARSET',  'utf8mb4' );
          define( 'DB_COLLATE',  '' );
          define( 'AUTH_KEY',         'ci-auth-key' );
          define( 'SECURE_AUTH_KEY',  'ci-secure-auth-key' );
          define( 'LOGGED_IN_KEY',    'ci-logged-in-key' );
          define( 'NONCE_KEY',        'ci-nonce-key' );
          define( 'AUTH_SALT',        'ci-auth-salt' );
          define( 'SECURE_AUTH_SALT', 'ci-secure-auth-salt' );
          define( 'LOGGED_IN_SALT',   'ci-logged-in-salt' );
          define( 'NONCE_SALT',       'ci-nonce-salt' );
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL',  'admin@example.org' );
          define( 'WP_TESTS_TITLE',  'Better REST API Logs Test Suite' );
          define( 'WP_PHP_BINARY',   'php' );
          define( 'WPLANG',          '' );
          define( 'WP_DEBUG',        true );
          $table_prefix = 'wptests_';
          PHP

      - run: composer test

      - name: Run perf microbench (PHP 8.3 only)
        if: matrix.php-version == '8.3'
        run: vendor/bin/phpunit --group perf --testsuite=integration
        continue-on-error: false

      - name: Run e2e latency probe (informational, PHP 8.3 only)
        if: matrix.php-version == '8.3'
        run: vendor/bin/phpunit --group perf --filter E2eLatencyTest --testsuite=integration || true
        continue-on-error: true

      - name: Enforce unit coverage gate
        run: composer test:unit:coverage-check

  dist:
    name: Build dist zip
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --classmap-authoritative --no-interaction --no-progress

      - run: bash bin/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: better-rest-api-logs-dist
          path: release/better-rest-api-logs.zip
          retention-days: 7

  browser-smoke:
    name: Browser smoke (PHP 8.2 / latest WP)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, zip, mysql
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install WordPress core
        run: |
          mkdir -p /tmp/wp-core
          curl -fsSL https://wordpress.org/latest.tar.gz -o /tmp/wp.tar.gz
          tar -xf /tmp/wp.tar.gz -C /tmp/wp-core --strip-components=1

      - name: Configure WordPress for browser tests
        run: |
          # Generate wp-config.php in the WP core directory
          cp /tmp/wp-core/wp-config-sample.php /tmp/wp-core/wp-config.php
          sed -i "s/database_name_here/wordpress_e2e/" /tmp/wp-core/wp-config.php
          sed -i "s/username_here/root/" /tmp/wp-core/wp-config.php
          sed -i "s/password_here/root/" /tmp/wp-core/wp-config.php
          sed -i "s/localhost/127.0.0.1/" /tmp/wp-core/wp-config.php
          # Create the E2E database
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS wordpress_e2e;"
          # Install WP-CLI
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp
          chmod +x /usr/local/bin/wp
          # Install WordPress
          wp core install \
            --path=/tmp/wp-core \
            --url=http://localhost:8080 \
            --title="BRL E2E" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.com \
            --skip-email \
            --allow-root
          # Enable pretty permalinks for REST routing
          wp rewrite structure '/%postname%/' --path=/tmp/wp-core --allow-root
          wp rewrite flush --hard --path=/tmp/wp-core --allow-root
          # Symlink the plugin into the WP plugins directory
          ln -sf "${{ github.workspace }}" /tmp/wp-core/wp-content/plugins/better-rest-api-logs
          # Activate the plugin
          wp plugin activate better-rest-api-logs --path=/tmp/wp-core --allow-root

      - name: Start PHP built-in server
        run: |
          php -S 0.0.0.0:8080 -t /tmp/wp-core &
          sleep 3
          curl -fsSL http://localhost:8080/wp-json/ -o /dev/null || true

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: admin
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 7

  plugin-check:
    name: WP plugin-check (against dist zip)
    runs-on: ubuntu-latest
    needs: [dist]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: better-rest-api-logs-dist
          path: dist/

      - name: Unzip dist
        run: |
          mkdir -p plugin-check-target
          unzip -q dist/better-rest-api-logs.zip -d plugin-check-target/

      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: plugin-check-target/better-rest-api-logs
          wp-version: 'latest'
          categories: 'plugin_repo,security'
          # Two checks fire false-positives on this codebase. plugin-check
          # derives the expected hook prefix from the plugin slug and does
          # not honour our local phpcs.xml.dist prefix registration of brl_;
          # the abbreviated form is documented in CLAUDE.md and used by
          # WooCommerce, BuddyPress, and others. PluginCheck.Security.DirectDB
          # is plugin-check's own non-PHPCS checker and cannot see our inline
          # phpcs:ignore annotations; the flagged variables come from the
          # Database::*_table accessor and Sort::validate whitelist, so the
          # interpolation is safe.
          ignore-codes: 'WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound,PluginCheck.Security.DirectDB.UnescapedDBParameter'
