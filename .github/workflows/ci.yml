# Phase 1 deliverable (Plan 01-06). Five-job CI workflow.
#
# Job topology:
#   banlist        — independent, full-repo ban-pattern scan (runs in parallel)
#   lint           — PHPCS + PHPStan on a single PHP 8.2 cell
#   test           — 16-cell PHPUnit matrix (PHP {7.4,8.2,8.3,8.4} × WP {6.6,6.7,6.8,6.9})
#                    depends on `lint`; MariaDB 10.11 service container; WP version
#                    floats to the latest patch in each minor branch at run time per D-02
#   dist           — builds release zip via bin/build-release.sh, uploads artifact
#                    depends on `lint`
#   plugin-check   — runs WordPress/plugin-check-action@v1 against the dist zip per QA-06
#                    depends on `dist`
#
# Locked decisions (.planning/phases/01-bootstrap-ci-matrix/01-CONTEXT.md):
#   D-01 — matrix is exactly 16 cells, no exclusions
#   D-02 — WP version floats per minor branch at run time (no hardcoded patches)
#   D-03 — floor PHP 7.4 × WP 6.6.x and ceiling PHP 8.4 × WP 6.9.x must stay green
#   D-04 — PHP 8.0 and 8.1 are intentionally absent (no signal vs minutes burned)
#   D-05 — WP 7.0 is intentionally absent (not yet released; add when shipped)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  banlist:
    name: Ban-list grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run banlist (full-repo scan)
        run: bash bin/check-banlist.sh

  lint:
    name: PHPCS + PHPStan (single PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=Off

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: composer phpcs
      - run: composer phpstan

  test:
    name: PHPUnit (PHP ${{ matrix.php }} × WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']
        wp:  ['6.6', '6.7', '6.8', '6.9']
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli, mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Resolve latest WP patch for branch ${{ matrix.wp }}
        id: wp-version
        run: |
          # Floats matrix.wp like "6.6" to the latest 6.6.x at run time (D-02).
          # Same endpoint WP core itself uses for stable-check.
          LATEST=$(curl -fsSL https://api.wordpress.org/core/stable-check/1.0/ \
            | jq -r --arg branch "${{ matrix.wp }}" '
                to_entries
                | map(select(.key | startswith($branch + ".")))
                | sort_by(.key | split(".") | map(tonumber))
                | last
                | .key
              ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not resolve latest patch for WP ${{ matrix.wp }}"; exit 1
          fi
          echo "wp_version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest WP ${{ matrix.wp }} patch: ${LATEST}"

      - name: Set up WP test environment
        env:
          WP_VERSION: ${{ steps.wp-version.outputs.wp_version }}
        run: |
          # wp-phpunit is installed via Composer; we just need WP core itself
          # at the matrix-selected version. Download and lay out alongside.
          mkdir -p /tmp/wordpress
          curl -fsSL https://wordpress.org/wordpress-${WP_VERSION}.tar.gz | tar -xz -C /tmp
          mv /tmp/wordpress /tmp/wp-core
          # Configure wp-tests-config.php from the wp-phpunit sample.
          cp vendor/wp-phpunit/wp-phpunit/wp-tests-config-sample.php /tmp/wp-tests-config.php
          sed -i "s|dirname( __FILE__ ) . '/src/'|'/tmp/wp-core/'|" /tmp/wp-tests-config.php
          sed -i "s|youremptytestdbnamehere|wordpress_test|" /tmp/wp-tests-config.php
          sed -i "s|yourusernamehere|root|" /tmp/wp-tests-config.php
          sed -i "s|yourpasswordhere|root|" /tmp/wp-tests-config.php
          sed -i "s|localhost|127.0.0.1|" /tmp/wp-tests-config.php
          echo "WP_TESTS_CONFIG_FILE_PATH=/tmp/wp-tests-config.php" >> "$GITHUB_ENV"
          echo "WP_TESTS_DIR=$(pwd)/vendor/wp-phpunit/wp-phpunit" >> "$GITHUB_ENV"

      - run: composer test:unit
      - run: composer test:integration

  dist:
    name: Build dist zip
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      artifact-name: better-rest-api-logs-dist
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --classmap-authoritative --no-interaction --no-progress

      - run: bash bin/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: better-rest-api-logs-dist
          path: release/better-rest-api-logs.zip
          retention-days: 7

  plugin-check:
    name: WP plugin-check (against dist zip)
    runs-on: ubuntu-latest
    needs: [dist]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: better-rest-api-logs-dist
          path: dist/

      - name: Unzip dist
        run: |
          mkdir -p plugin-check-target
          unzip -q dist/better-rest-api-logs.zip -d plugin-check-target/

      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: plugin-check-target/better-rest-api-logs
          wp-version: 'latest'
          # Categories per WP.org submission gate.
          categories: 'plugin_repo,security,general'
          # Phase 1 has no UI; phpcs-related checks live in our own PHPCS job.
          exclude-checks: ''
